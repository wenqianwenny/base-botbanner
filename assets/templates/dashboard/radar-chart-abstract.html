<!--
Base Bot Banner dashboard radar-chart abstraction template.
Copy this component when abstracting radar chart cards.
Scale .radar-card-abstract as a whole; the center radar graphic scales with the card.
-->
<style>
  .radar-card-abstract {
    width: 431px;
    height: 452px;
    border-radius: 16px;
    background: #fff;
    position: relative;
    overflow: hidden;
  }

  .radar-title-skeleton {
    position: absolute;
    left: 20px;
    top: 20px;
    width: 90px;
    height: 18px;
    border-radius: 100px;
    background: rgba(15, 15, 16, 0.06);
  }

  .radar-visual {
    position: absolute;
    left: 50%;
    top: 85px;
    width: min(330px, calc(100% - 88px));
    aspect-ratio: 1;
    transform: translateX(-50%);
  }

  .radar-grid {
    stroke: rgba(15, 15, 16, 0.06);
    stroke-width: 1;
    fill: none;
  }

  .radar-shape {
    fill: rgba(15, 15, 16, 0.06);
    stroke: rgba(15, 15, 16, 0.06);
    stroke-width: 2;
    stroke-linejoin: round;
  }
</style>
